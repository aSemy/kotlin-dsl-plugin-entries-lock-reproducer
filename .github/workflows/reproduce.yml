name: Reproduce

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Gradle ${{ matrix.gradle-version }}
    strategy:
      fail-fast: false
      matrix:
        # 9.4.1 is the last release before KotlinDslPluginEntryCache (added in 9.5.0)
        gradle-version: [ "9.4.1", "9.8.1" ]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test -PtestGradleVersion=${{ matrix.gradle-version }}
        shell: bash
