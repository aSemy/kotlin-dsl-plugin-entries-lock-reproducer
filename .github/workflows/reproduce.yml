name: Reproduce

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      gradle-version:
        description: Gradle version run by TestKit
        default: "9.8.1"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run reproducer
        shell: bash
        run: ./gradlew test --stacktrace -PtestGradleVersion=${{ inputs.gradle-version || '9.8.1' }}
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: build/reports/tests
